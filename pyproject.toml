[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-synth"
version = "0.1.0"
description = "Event-driven piano dataset and rendering baseline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "soundfile>=0.12,<1",
    "librosa>=0.10.2,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "soxr>=0.3.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
piano-synth = "piano_synth.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]